<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K23 Forum - Diễn đàn Thảo luận Công nghệ & Học tập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      
      /* Light theme tokens */
      --bg-base: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      --bg-subtle: #f8fafc;
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.25);
      
      --accent: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      --accent-gradient-warm: linear-gradient(135deg, #f43f5e 0%, #fb923c 100%);
      
      --success: #10b981;
      --success-bg: #ecfdf5;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      
      --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
      --card-shadow-hover: 0 12px 28px -4px rgba(15, 23, 42, 0.1), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      
      --header-bg: rgba(255, 255, 255, 0.82);
    }

    [data-theme="dark"] {
      --bg-base: #090d16;
      --bg-surface: #111827;
      --bg-surface-elevated: #1a2234;
      --bg-subtle: #162032;
      --border-color: #1f293d;
      --border-hover: #334155;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      
      --primary: #6366f1;
      --primary-light: rgba(99, 102, 241, 0.15);
      --primary-hover: #818cf8;
      --primary-glow: rgba(99, 102, 241, 0.35);
      
      --accent: #22d3ee;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
      
      --card-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.4);
      --card-shadow-hover: 0 14px 34px -4px rgba(0, 0, 0, 0.55);
      
      --header-bg: rgba(17, 24, 39, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.06) 0px, transparent 50%);
      background-attachment: fixed;
    }

    /* Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 18px 80px 18px;
    }

    /* Top Sticky Navigation */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
      padding: 14px 24px;
    }
    .navbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 5px 12px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }
    .btn-icon:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* Stats Ribbon */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }
    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--card-shadow);
    }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--primary-light);
      color: var(--primary);
    }
    .stat-info .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.2;
    }
    .stat-info .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Main Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 26px 30px;
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 18px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 640px) {
      .form-row { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg-subtle);
      transition: all 0.2s ease;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      background: var(--bg-surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    textarea {
      min-height: 105px;
      resize: vertical;
    }

    .btn-gradient {
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 12px 26px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px var(--primary-glow);
      transition: all 0.2s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--primary-glow);
      filter: brightness(1.08);
    }
    .btn-gradient:active {
      transform: translateY(0);
    }
    .btn-gradient:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Filter Toolbar */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 22px;
    }
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-box input {
      padding-left: 42px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      color: var(--text-subtle);
    }
    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .pill {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .pill:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    /* Post Card Item */
    .post-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px 26px;
      margin-bottom: 18px;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      animation: fadeIn 0.3s ease-out;
    }
    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--card-shadow-hover);
      border-color: var(--border-hover);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .author-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .author-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.3;
    }
    .post-time {
      font-size: 0.78rem;
      color: var(--text-subtle);
    }
    .topic-tag {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .post-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
      line-height: 1.4;
    }
    .post-body {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    /* Post Actions */
    .post-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    .action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .action-btn:hover {
      background: var(--bg-subtle);
      color: var(--primary);
      border-color: var(--primary);
    }
    .action-btn.liked {
      background: rgba(244, 63, 94, 0.1);
      color: #f43f5e;
      border-color: rgba(244, 63, 94, 0.3);
    }

    /* Comments Section */
    .comments-wrapper {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-color);
      display: none;
    }
    .comments-wrapper.open {
      display: block;
      animation: fadeIn 0.25s ease;
    }
    .comment-item {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      background: var(--bg-subtle);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-gradient-warm);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .comment-content {
      flex: 1;
    }
    .comment-author {
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }
    .comment-text {
      font-size: 0.88rem;
      color: var(--text-main);
      white-space: pre-wrap;
    }
    .comment-time {
      font-size: 0.72rem;
      color: var(--text-subtle);
      margin-top: 4px;
    }

    .comment-form {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .comment-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.88rem;
      border-radius: var(--radius-sm);
    }
    .btn-comment {
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 14px 20px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateX(100%);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    .toast-success { border-left: 4px solid var(--success); }
    .toast-error { border-left: 4px solid var(--danger); }
    .toast-info { border-left: 4px solid var(--primary); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="#" class="brand">
        <div class="brand-logo">💬</div>
        <div class="brand-text">
          <h1>K23 Forum</h1>
          <p>Diễn đàn Thảo luận & Chia sẻ Tri thức</p>
        </div>
      </a>
      <div class="nav-actions">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>Online</span>
        </div>
        <button class="btn-icon" id="theme-toggle" title="Đổi giao diện Sáng / Tối">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Stat Ribbon -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-info">
          <div class="stat-value" id="stat-posts">0</div>
          <div class="stat-label">Bài thảo luận</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💭</div>
        <div class="stat-info">
          <div class="stat-value" id="stat-comments">0</div>
          <div class="stat-label">Bình luận</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏷️</div>
        <div class="stat-info">
          <div class="stat-value" id="stat-topics">0</div>
          <div class="stat-label">Chuyên mục</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-info">
          <div class="stat-value" id="stat-users">0</div>
          <div class="stat-label">Thành viên</div>
        </div>
      </div>
    </div>

    <!-- Create Post Section -->
    <div class="card" id="create-post-section">
      <div class="card-header">
        <div class="card-title">
          <span>✍️</span>
          <span>Tạo bài thảo luận mới</span>
        </div>
      </div>

      <form id="create-post-form">
        <div class="form-group">
          <label for="title">Tiêu đề bài viết:</label>
          <input type="text" id="title" placeholder="VD: Chia sẻ kinh nghiệm tối ưu Nginx và Prometheus..." required autocomplete="off">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="topic_id">Chuyên mục thảo luận:</label>
            <select id="topic_id" required>
              <option value="">-- Đang nạp danh mục... --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="user_id">Tài khoản đăng bài:</label>
            <select id="user_id" required>
              <option value="">-- Đang nạp người dùng... --</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="content">Nội dung chi tiết:</label>
          <textarea id="content" placeholder="Chia sẻ chi tiết thắc mắc, đoạn mã hoặc tài liệu cần thảo luận cùng mọi người..." required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end;">
          <button type="submit" class="btn-gradient" id="btn-submit">
            <span>🚀 Đăng bài ngay</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Posts Filter & Search Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Tìm kiếm bài viết theo tiêu đề, nội dung hoặc tác giả...">
      </div>

      <div class="category-pills" id="category-pills">
        <button class="pill active" data-topic-id="all">✨ Tất cả chuyên mục</button>
      </div>
    </div>

    <!-- Posts Container -->
    <div id="posts-container">
      <div class="empty-state">
        <span class="empty-icon">⏳</span>
        Đang tải các bài thảo luận...
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    // State management
    let state = {
      topics: [],
      users: [],
      posts: [],
      filteredPosts: [],
      activeTopicId: 'all',
      searchKeyword: '',
      likes: JSON.parse(localStorage.getItem('forum_likes') || '{}')
    };

    // Color generation for avatars
    const avatarGradients = [
      'linear-gradient(135deg, #6366f1, #a855f7)',
      'linear-gradient(135deg, #06b6d4, #3b82f6)',
      'linear-gradient(135deg, #10b981, #059669)',
      'linear-gradient(135deg, #f59e0b, #ef4444)',
      'linear-gradient(135deg, #ec4899, #8b5cf6)'
    ];

    function getAvatarBg(name) {
      if (!name) return avatarGradients[0];
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return avatarGradients[Math.abs(hash) % avatarGradients.length];
    }

    // Theme toggle
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    
    function initTheme() {
      const saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      themeIcon.innerText = saved === 'dark' ? '☀️' : '🌙';
    }
    
    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('theme', target);
      themeIcon.innerText = target === 'dark' ? '☀️' : '🌙';
    });

    // Toast utility
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      const icon = type === 'success' ? '✅' : type === 'error' ? '⚠️' : 'ℹ️';
      toast.innerHTML = `<span>${icon}</span><span>${escapeHtml(message)}</span>`;
      
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 350);
      }, 4000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Relative timestamp
    function formatTime(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffSec = Math.floor((now - date) / 1000);

      if (diffSec < 60) return 'Vừa xong';
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)} phút trước`;
      if (diffSec < 86400) return `${Math.floor(diffSec / 3600)} giờ trước`;
      if (diffSec < 604800) return `${Math.floor(diffSec / 86400)} ngày trước`;

      return date.toLocaleDateString('vi-VN', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });
    }

    // Load statistics
    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        if (res.ok) {
          const stats = await res.json();
          document.getElementById('stat-posts').innerText = stats.totalPosts || 0;
          document.getElementById('stat-comments').innerText = stats.totalComments || 0;
          document.getElementById('stat-topics').innerText = stats.totalTopics || 0;
          document.getElementById('stat-users').innerText = stats.totalUsers || 0;
        }
      } catch (e) {
        console.warn('Lỗi lấy thống kê:', e);
      }
    }

    // Load topics
    async function loadTopics() {
      try {
        const res = await fetch('/api/topics');
        state.topics = await res.json();
        
        const select = document.getElementById('topic_id');
        const pillsContainer = document.getElementById('category-pills');

        if (Array.isArray(state.topics) && state.topics.length > 0) {
          select.innerHTML = state.topics.map(t => 
            `<option value="${t.id}">${escapeHtml(t.name)}</option>`
          ).join('');

          pillsContainer.innerHTML = `
            <button class="pill ${state.activeTopicId === 'all' ? 'active' : ''}" data-topic-id="all">✨ Tất cả chuyên mục</button>
            ${state.topics.map(t => `
              <button class="pill ${state.activeTopicId == t.id ? 'active' : ''}" data-topic-id="${t.id}">
                📂 ${escapeHtml(t.name)}
              </button>
            `).join('')}
          `;
          
          pillsContainer.querySelectorAll('.pill').forEach(btn => {
            btn.addEventListener('click', () => {
              pillsContainer.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
              btn.classList.add('active');
              state.activeTopicId = btn.getAttribute('data-topic-id');
              filterPosts();
            });
          });
        }
      } catch (e) {
        console.error('Lỗi nạp topics:', e);
      }
    }

    // Load users
    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        state.users = await res.json();
        const select = document.getElementById('user_id');
        if (Array.isArray(state.users) && state.users.length > 0) {
          select.innerHTML = state.users.map(u => 
            `<option value="${u.id}">${escapeHtml(u.username)}</option>`
          ).join('');
        }
      } catch (e) {
        console.error('Lỗi nạp users:', e);
      }
    }

    // Load and render posts
    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        const res = await fetch('/api/posts');
        state.posts = await res.json();
        filterPosts();
      } catch (err) {
        console.error('Lỗi nạp bài viết:', err);
        container.innerHTML = `
          <div class="empty-state" style="color: var(--danger);">
            <span class="empty-icon">⚠️</span>
            Không thể tải dữ liệu thảo luận. Vui lòng thử lại sau!
          </div>
        `;
      }
    }

    function filterPosts() {
      let list = state.posts || [];

      // Filter by Topic
      if (state.activeTopicId !== 'all') {
        list = list.filter(p => p.topic_id == state.activeTopicId);
      }

      // Filter by Keyword
      if (state.searchKeyword) {
        const q = state.searchKeyword.toLowerCase();
        list = list.filter(p => 
          (p.title && p.title.toLowerCase().includes(q)) ||
          (p.content && p.content.toLowerCase().includes(q)) ||
          (p.username && p.username.toLowerCase().includes(q))
        );
      }

      renderPosts(list);
    }

    function renderPosts(posts) {
      const container = document.getElementById('posts-container');
      if (!Array.isArray(posts) || posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">📭</span>
            Không tìm thấy bài thảo luận nào phù hợp!
          </div>
        `;
        return;
      }

      container.innerHTML = posts.map(p => {
        const initial = (p.username || 'U').substring(0, 2).toUpperCase();
        const avatarBg = getAvatarBg(p.username);
        const topicName = p.topic_name || 'Thảo luận chung';
        const isLiked = !!state.likes[p.id];
        const likeCount = (state.likes[p.id] ? 1 : 0);

        return `
          <article class="post-card" id="post-${p.id}">
            <div class="post-header">
              <div class="author-info">
                <div class="avatar" style="background: ${avatarBg}">${initial}</div>
                <div>
                  <div class="author-name">${escapeHtml(p.username || 'Thành viên')}</div>
                  <div class="post-time">${formatTime(p.created_at)}</div>
                </div>
              </div>
              <span class="topic-tag">${escapeHtml(topicName)}</span>
            </div>

            <h2 class="post-title">${escapeHtml(p.title)}</h2>
            <div class="post-body">${escapeHtml(p.content)}</div>

            <div class="post-actions">
              <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${p.id})">
                <span>${isLiked ? '❤️' : '🤍'}</span>
                <span id="like-count-${p.id}">${likeCount > 0 ? likeCount : 'Thích'}</span>
              </button>
              
              <button class="action-btn" onclick="toggleComments(${p.id})">
                <span>💬</span>
                <span>Bình luận</span>
              </button>

              <button class="action-btn" onclick="copyPostLink(${p.id})">
                <span>🔗</span>
                <span>Chia sẻ</span>
              </button>
            </div>

            <!-- Comment Drawer -->
            <div class="comments-wrapper" id="comments-box-${p.id}">
              <div id="comments-list-${p.id}">
                <div style="font-size: 0.85rem; color: var(--text-subtle);">Đang nạp phản hồi...</div>
              </div>

              <form class="comment-form" onsubmit="submitComment(event, ${p.id})">
                <input type="text" class="comment-input" id="comment-input-${p.id}" placeholder="Viết phản hồi của bạn..." required autocomplete="off">
                <button type="submit" class="btn-gradient btn-comment">Gửi</button>
              </form>
            </div>
          </article>
        `;
      }).join('');
    }

    // Toggle Likes
    function toggleLike(postId) {
      if (state.likes[postId]) {
        delete state.likes[postId];
      } else {
        state.likes[postId] = true;
      }
      localStorage.setItem('forum_likes', JSON.stringify(state.likes));
      filterPosts();
    }

    // Copy Post Link
    function copyPostLink(postId) {
      const url = `${window.location.origin}#post-${postId}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Đã sao chép liên kết bài viết!', 'success');
      }).catch(() => {
        showToast('Không thể sao chép liên kết.', 'error');
      });
    }

    // Toggle & Load Comments
    async function toggleComments(postId) {
      const box = document.getElementById(`comments-box-${postId}`);
      if (!box) return;

      const isOpen = box.classList.contains('open');
      if (isOpen) {
        box.classList.remove('open');
      } else {
        box.classList.add('open');
        await loadComments(postId);
      }
    }

    async function loadComments(postId) {
      const listContainer = document.getElementById(`comments-list-${postId}`);
      try {
        const res = await fetch(`/api/posts/${postId}/comments`);
        const comments = await res.json();

        if (!Array.isArray(comments) || comments.length === 0) {
          listContainer.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-subtle); margin-bottom: 10px;">Chưa có bình luận nào. Hãy là người đầu tiên tham gia thảo luận!</div>';
          return;
        }

        listContainer.innerHTML = comments.map(c => {
          const init = (c.username || 'U').substring(0, 2).toUpperCase();
          return `
            <div class="comment-item">
              <div class="comment-avatar">${init}</div>
              <div class="comment-content">
                <div class="comment-author">${escapeHtml(c.username || 'Thành viên')}</div>
                <div class="comment-text">${escapeHtml(c.content)}</div>
                <div class="comment-time">${formatTime(c.created_at)}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        listContainer.innerHTML = '<div style="font-size: 0.85rem; color: var(--danger);">Lỗi khi nạp bình luận.</div>';
      }
    }

    // Submit new comment
    async function submitComment(event, postId) {
      event.preventDefault();
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      const userSelect = document.getElementById('user_id');
      const user_id = userSelect ? parseInt(userSelect.value, 10) : 1;

      if (!content) return;

      try {
        const res = await fetch(`/api/posts/${postId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, user_id })
        });

        if (res.ok) {
          input.value = '';
          showToast('Phản hồi thành công!', 'success');
          await loadComments(postId);
          loadStats();
        } else {
          showToast('Không thể gửi bình luận!', 'error');
        }
      } catch (err) {
        showToast('Lỗi mạng khi gửi bình luận.', 'error');
      }
    }

    // Submit new post
    document.getElementById('create-post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('btn-submit');
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      const topic_id = parseInt(document.getElementById('topic_id').value, 10);
      const user_id = parseInt(document.getElementById('user_id').value, 10);

      if (!title || !content || !topic_id || !user_id) {
        showToast('Vui lòng điền đầy đủ các thông tin bắt buộc!', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>⏳ Đang xử lý...</span>';

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, topic_id, user_id })
        });

        const data = await res.json();
        if (res.ok) {
          showToast('🎉 Đã đăng bài viết thảo luận thành công!', 'success');
          document.getElementById('create-post-form').reset();
          await loadPosts();
          loadStats();
          
          // Scroll to posts
          document.getElementById('posts-container').scrollIntoView({ behavior: 'smooth' });
        } else {
          showToast(data.error || 'Có lỗi khi tạo bài viết!', 'error');
        }
      } catch (err) {
        showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>🚀 Đăng bài ngay</span>';
      }
    });

    // Search input event
    document.getElementById('search-input').addEventListener('input', (e) => {
      state.searchKeyword = e.target.value.trim();
      filterPosts();
    });

    // Initialize Page
    initTheme();
    loadStats();
    loadTopics();
    loadUsers();
    loadPosts();
  </script>
</body>
</html>

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: false

volumes:
  mysql_data:
  grafana_data:
  loki_data:

services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: forum_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Quan ly DB phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: forum_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy

  # 3. Web Application Node.js
  app:
    build:
      context: ./app
    container_name: forum_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      PORT: 3000
    volumes:
      - ./app/server.js:/app/server.js
      - ./app/public:/app/public
    networks:
      - backend_net
      - frontend_net
    depends_on:
      db:
        condition: service_healthy

  # 4. Nginx Reverse Proxy & SSL
  nginx:
    image: nginx:alpine
    container_name: forum_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - frontend_net
    depends_on:
      - app

  # 5. Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: forum_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - backend_net

  # 6. Container Metrics Exporter (cAdvisor)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: forum_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend_net

  # 7. Grafana Visualization
  grafana:
    image: grafana/grafana:10.4.0
    container_name: forum_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend_net

  # 8. Loki Centralized Logging
  loki:
    image: grafana/loki:2.9.4
    container_name: forum_loki
    restart: always
    user: "0:0"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - backend_net

  # 9. Promtail Log Shipper
  promtail:
    image: grafana/promtail:2.9.4
    container_name: forum_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./nginx/logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - backend_net
